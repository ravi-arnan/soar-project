version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Makassar
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/ravi/Projects/soar-project/scripts:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Jembatan SOAR human-in-the-loop: long-poll Telegram getUpdates (keluar saja,
  # aman di balik NAT) lalu teruskan klik tombol ke webhook n8n lokal.
  tg-callback-poller:
    image: python:3.12-alpine
    container_name: tg-callback-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - N8N_WEBHOOK=http://n8n:5678/webhook/tg-callback
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
    command: ["python3", "/scripts/tg-callback-poller.py"]
    depends_on:
      - n8n

volumes:
  n8n_data:
