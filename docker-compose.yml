services:
  n8n:
    image: n8nio/n8n:2.42.5
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=100.73.91.17
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Makassar
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ATRIA_API_KEY=${ATRIA_API_KEY}
      - FLEET_COMMAND_TOKEN=${FLEET_COMMAND_TOKEN}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false


      # Cegah Code node (Gemini/VT) mati di tengah lonjakan alert serentak
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_RUNNERS_MAX_CONCURRENCY=10
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/ravi/Projects/soar-project/scripts:/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Jembatan SOAR human-in-the-loop: long-poll Telegram getUpdates (keluar saja,
  # aman di balik NAT) lalu teruskan klik tombol ke webhook n8n lokal.
  tg-callback-poller:
    image: python:3.12-alpine
    container_name: tg-callback-poller
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - N8N_WEBHOOK=http://n8n:5678/webhook/tg-callback
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
    command: ["python3", "/scripts/tg-callback-poller.py"]
    depends_on:
      - n8n

  # Self-aware health monitor (kategori F): deteksi agent putus / n8n / LLM API /
  # Wazuh-API down, alert Telegram HANYA saat status berubah (anti-spam). Cek
  # keluar-saja; tak ada port yang diekspos.
  health-monitor:
    image: python:3.12-alpine
    container_name: health-monitor
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
      - health_state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "/scripts/health-monitor.py"]
    depends_on:
      - n8n

  # Fleet Monitor 100 PC — custom monitoring arahan dospem, desain Wazuh (light theme, header #011a2f, aksen #00a9e0)
  # Poll Wazuh API (30s) + terima heartbeat Rust agent (60s) -> single-pane 100 workstation.
  # Ringan: stdlib http.server, tanpa DB, bind 0.0.0.0:8080 (host run: python3 scripts/fleet-monitor.py, Tailscale 100.95.198.108:8080 untuk 100 PC).
  # Docker: butuh host network agar bisa reach Wazuh 127.0.0.1:55000 (manager bind 127.0.0.1). Alternatif: jalankan di host (lebih ringan, tanpa docker).
  fleet-monitor:
    image: python:3.12-alpine
    container_name: fleet-monitor
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: host
    env_file:
      - .env
    environment:
      - FLEET_PORT=8080
      - WAZUH_API_URL=https://127.0.0.1:55000
      - N8N_HEALTH_URL=http://127.0.0.1:5678/healthz
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLEET_COMMAND_TOKEN=${FLEET_COMMAND_TOKEN}
      - FLEET_AGENT_POLL_TOKENS_JSON=${FLEET_AGENT_POLL_TOKENS_JSON}
      # Riwayat event durable (SQLite) + Wazuh Indexer untuk view minggu/bulan.
      - FLEET_EVENTS_DB=/state/events.db
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-https://127.0.0.1:9200}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-admin}
      - WAZUH_INDEXER_PASS=${WAZUH_INDEXER_PASS}
      # Roster heartbeat di-persist supaya agent yang sedang offline tidak

      # hilang dari daftar saat container/restart (scripts mount read-only).
      - FLEET_STATE_FILE=/state/fleet-state.json
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
      - /home/ravi/Projects/soar-project/state:/state:rw
    command: ["python3", "/scripts/fleet-monitor.py"]
    depends_on:
      - n8n

  # Dashboard fleet (UI Wazuh lengkap dari wazuh-dashboard-clone) — menggantikan
  # tampilan fleet-monitor.py. Backend datanya TETAP fleet-monitor.py: Next
  # hanya mem-proxy /api/* ke sana (FLEET_API_URL), jadi agent & n8n tidak perlu
  # diubah. Build: docker build -t soar-fleet-dashboard ./dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: soar-fleet-dashboard:latest
    container_name: fleet-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - FLEET_COMMAND_TOKEN=${FLEET_COMMAND_TOKEN}
      - DASHBOARD_ALLOWED_ORIGINS=${DASHBOARD_ALLOWED_ORIGINS}
      - DASHBOARD_LOGIN_TOKEN=${DASHBOARD_LOGIN_TOKEN}
      # fleet-monitor pakai network_mode: host, jadi dari container harus lewat
      # gateway host (127.0.0.1 di dalam container bukan host).
      - FLEET_API_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - fleet-monitor

  # MISP feed consumer (sumber threat-intel ke-4): index feed CIRCL OSINT MISP
  # + API lookup. network_mode host agar n8n (container) reach via host.docker.internal:8090.
  misp-index:
    image: python:3.12-alpine
    container_name: misp-index
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: host
    env_file:
      - .env
    environment:
      - MISP_PORT=8090
      - MISP_DB=/state/misp.db
      - MISP_SYNC_HOURS=12
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
      - /home/ravi/Projects/soar-project/state:/state:rw
    command: ["python3", "/scripts/misp-feed-sync.py", "--serve", "--db", "/state/misp.db"]

  # Pencatat alert Telegram keluar (observability): Bot API tak punya histori
  # keluar, jadi n8n POST setiap alert terkirim ke sini (JSONL durable).
  alert-log:
    image: python:3.12-alpine
    container_name: alert-log
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    network_mode: host
    env_file:
      - .env
    environment:
      - ALERT_LOG_PORT=8091
      - ALERT_LOG_FILE=/state/telegram-alerts.jsonl
    volumes:
      - /home/ravi/Projects/soar-project/scripts:/scripts:ro
      - /home/ravi/Projects/soar-project/state:/state:rw
    command: ["python3", "/scripts/alert-log.py", "--serve"]

volumes:
  n8n_data:
  health_state:
