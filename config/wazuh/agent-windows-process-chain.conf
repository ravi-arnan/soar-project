<!--
  Konfigurasi tambahan untuk Wazuh AGENT Windows — koleksi Sysmon Event ID 1
  (ProcessCreate) untuk deteksi LOLBin chain (cmd -> powershell hidden
  -> python dari TEMP).

  SYARAT: Sysmon sudah terinstal di endpoint Windows
    (https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon)

  Cara apply:
    1. Letakkan Sysmon di endpoint, jalankan:
         Sysmon64.exe -accepteula -i sysmon-config.xml
       (config minimal ada di deploy/sysmon-minimal.xml)
    2. Tambahkan block <localfile> di bawah ke dalam
       C:\Program Files (x86)\ossec-agent\ossec.conf
       di dalam block <ossec_config>...</ossec_config> utama.
    3. restart-service wazuh-svc
-->

<!--
  Sysmon Event ID 1 (ProcessCreate): membaca dari Windows EventLog channel
  Microsoft-Windows-Sysmon/Operational.

  query: Event/System/EventID=1  -> hanya ProcessCreate events.
  Policentang: 20 detik.
  log_format: eventchannel -> Wazuh decode sebagai JSON otomatis.
-->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
  <query>Event/System/EventID=1</query>
</localfile>

<!--
  Windows Security Event ID 4688 (Process Creation) sebagai fallback
  non-Sysmon. Wajib mengaktifkan "Audit Process Creation" via GPO:
    Computer Configuration > Windows Settings > Security Settings >
    Advanced Audit Policy Configuration > Object Access >
    Audit Process Creation > Success

  Juga aktifkan "Include command line in process creation events":
    Administrative Templates > System > Audit Process Creation >
    Include command line...
-->
<localfile>
  <location>Security</location>
  <log_format>eventchannel</log_format>
  <query>Event/System/EventID=4688</query>
</localfile>