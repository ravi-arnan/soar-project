<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline SOAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:860px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:760px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>Pipeline Pengolahan Data SOAR</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 760 800" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="pl-title pl-desc">
        <title id="pl-title">Pipeline pengolahan data dari endpoint sampai respons</title>
        <desc id="pl-desc">Data mengalir berurutan dari berkas pada endpoint, di-hash oleh agen, dicocokkan aturannya oleh Wazuh Manager, disaring jembatan custom-n8n, dinormalisasi oleh n8n, diperkaya threat intel, diklasifikasi severity, diringkas oleh LLM, lalu ditindaklanjuti secara berjenjang: karantina otomatis, tombol human-in-the-loop, atau senyap.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <line x1="330" y1="100" x2="330" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="105" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="374" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HASH + PATH</text>

        <line x1="330" y1="182" x2="330" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="187" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="196" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

        <line x1="330" y1="264" x2="330" y2="286" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="269" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="278" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERT</text>

        <line x1="330" y1="346" x2="330" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="351" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="366" y="360" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

        <line x1="330" y1="428" x2="330" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="433" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="364" y="442" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PAYLOAD</text>

        <line x1="330" y1="510" x2="330" y2="532" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="515" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDIKATOR</text>

        <line x1="330" y1="592" x2="330" y2="614" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="597" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="362" y="606" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

        <line x1="330" y1="674" x2="330" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="679" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="366" y="688" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NARASI</text>

        <!-- Nodes (painted last) -->
        <rect x="160" y="40" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="40" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Endpoint</text>
        <text x="330" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">berkas baru / akses URL</text>

        <rect x="160" y="122" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="122" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · soar-agent (FIM)</text>
        <text x="330" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hitung SHA-256 · kirim event</text>

        <rect x="160" y="204" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="204" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Wazuh Manager</text>
        <text x="330" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cocokkan aturan · buat alert</text>

        <rect x="160" y="286" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="286" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Jembatan custom-n8n</text>
        <text x="330" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">saring noise · teruskan webhook</text>

        <rect x="160" y="368" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="368" width="340" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="330" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Orkestrasi n8n</text>
        <text x="330" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ekstrak &amp; normalisasi alert</text>

        <rect x="160" y="450" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="450" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Pengayaan intel</text>
        <text x="330" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VirusTotal · MalwareBazaar · OTX · MISP</text>

        <rect x="160" y="532" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="532" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 · Klasifikasi severity</text>
        <text x="330" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CRITICAL · HIGH · MEDIUM · INFO</text>

        <rect x="160" y="614" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="614" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="638" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8 · Ringkasan LLM</text>
        <text x="330" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">narasi &amp; rekomendasi Bahasa Indonesia</text>

        <rect x="160" y="696" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="696" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="720" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">9 · Respons berjenjang</text>
        <text x="330" y="738" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto-karantina · tombol HITL · senyap</text>
      </svg>
    </div>
  </div>
</body>
</html>
