<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Waterfall</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · Diagram Design</p>
    <h1>Model Pengembangan Waterfall</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="wf-title wf-desc">
        <title id="wf-title">Model pengembangan waterfall lima tahap</title>
        <desc id="wf-desc">Lima tahap pengembangan berurutan turun seperti air terjun: analisis kebutuhan, desain sistem, implementasi, pengujian, dan pemeliharaan. Setiap tahap mengalir ke tahap berikutnya setelah tahap sebelumnya selesai.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <path d="M165,96 V104 Q165,112 173,112 H297 Q305,112 305,120 V124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="214" y="106" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="237" y="115" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LANJUT</text>

        <path d="M305,180 V188 Q305,196 313,196 H437 Q445,196 445,204 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="354" y="190" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="377" y="199" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LANJUT</text>

        <path d="M445,264 V272 Q445,280 453,280 H577 Q585,280 585,288 V292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="494" y="274" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="517" y="283" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LANJUT</text>

        <path d="M585,348 V356 Q585,364 593,364 H717 Q725,364 725,372 V376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="634" y="358" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="657" y="367" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LANJUT</text>

        <!-- Nodes (painted last) -->
        <rect x="40" y="40" width="250" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="250" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="165" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Analisis Kebutuhan</text>
        <text x="165" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">studi literatur · kebutuhan</text>

        <rect x="180" y="124" width="250" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="124" width="250" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="305" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Desain Sistem</text>
        <text x="305" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arsitektur · alur playbook</text>

        <rect x="320" y="208" width="250" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="208" width="250" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="445" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Implementasi</text>
        <text x="445" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">n8n · agen · threat intel</text>

        <rect x="460" y="292" width="250" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="292" width="250" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="585" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Pengujian</text>
        <text x="585" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E2E · MTTR · beban</text>

        <rect x="600" y="376" width="250" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="376" width="250" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="725" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Pemeliharaan</text>
        <text x="725" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">monitoring · pembaruan</text>
      </svg>
    </div>
  </div>
</body>
</html>
