<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alur Notifikasi Telegram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:900px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:760px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Alur Notifikasi dan Respons Telegram</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 760 920" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="tg-title tg-desc">
        <title id="tg-title">Alur dari log endpoint sampai notifikasi dan respons Telegram</title>
        <desc id="tg-desc">Log dari endpoint diproses Wazuh Manager lalu n8n. Bila terdeteksi anomali, severity dan pengayaan dihitung, lalu sebuah notifikasi Telegram dikirim: severity tinggi membuka tombol keputusan, severity sedang dikirim sebagai informasi senyap. Bila tidak ada anomali, proses berhenti senyap. Respons analis mengeksekusi karantina berkas atau menandainya false positive.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <line x1="300" y1="104" x2="300" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="192" x2="300" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="280" x2="300" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="376" x2="300" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="306" y="392" width="26" height="12" rx="2" fill="#f5f5f5"/>
        <text x="319" y="401" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YA</text>

        <line x1="450" y1="340" x2="560" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="482" y="334" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="343" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIDAK</text>
        <text x="566" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">SELESAI — senyap</text>

        <line x1="300" y1="492" x2="300" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="608" x2="300" y2="660" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="306" y="626" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="352" y="635" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRITICAL/HIGH</text>

        <path d="M450,572 H600 Q608,572 608,580 V690 Q608,698 600,698 H450" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="612" y="628" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="638" y="637" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEDIUM</text>

        <line x1="300" y1="736" x2="300" y2="784" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="306" y="752" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="354" y="761" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISOLASI/ABAIKAN</text>

        <!-- Nodes (painted last) -->
        <rect x="150" y="40" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="40" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Endpoint</text>
        <text x="300" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agen kirim log (FIM / akses URL)</text>

        <rect x="150" y="128" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="128" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Wazuh Manager</text>
        <text x="300" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cocokkan aturan · buat alert</text>

        <rect x="150" y="216" width="300" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="216" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Orkestrasi n8n</text>
        <text x="300" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ambil &amp; proses alert</text>

        <rect x="150" y="304" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="304" width="300" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="300" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Anomali / ancaman?</text>
        <text x="300" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert cocok dengan aturan serangan</text>

        <rect x="150" y="420" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="420" width="300" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Klasifikasi &amp; Enrichment</text>
        <text x="300" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">severity · VirusTotal/MB · ringkasan LLM</text>

        <rect x="150" y="536" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="536" width="300" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="300" y="566" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Severity CRITICAL / HIGH?</text>
        <text x="300" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keyakinan berdasarkan verdict intel</text>

        <rect x="150" y="660" width="300" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="660" width="300" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="300" y="688" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 · Notifikasi Telegram</text>
        <text x="300" y="706" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tombol Isolasi/Abaikan — atau info senyap</text>

        <rect x="150" y="784" width="300" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="784" width="300" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="814" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8 · Respons</text>
        <text x="300" y="832" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">karantina berkas (AR) / tandai false positive</text>
      </svg>
    </div>
  </div>
</body>
</html>
