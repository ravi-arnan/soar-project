<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respons Hybrid</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Respons Hybrid: Otonom dan Human-in-the-Loop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="dh-title dh-desc">
        <title id="dh-title">Respons hybrid berdasarkan tingkat keyakinan</title>
        <desc id="dh-desc">Berkas baru dideteksi dan di-hash, lalu diperkaya oleh threat intel dan LLM. Bila keyakinan tinggi, berkas dikarantina otomatis tanpa tombol. Bila keyakinan rendah, analis ditanya lewat Telegram; klik Isolasi mengarantina berkas secara human-in-the-loop, klik Abaikan menandainya false positive.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <line x1="330" y1="100" x2="330" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="330" y1="182" x2="330" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="330" y1="264" x2="330" y2="286" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="500" y1="322" x2="620" y2="322" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="526" y="316" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="558" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VT &gt;= 20</text>

        <line x1="330" y1="358" x2="330" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="372" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAGU</text>

        <line x1="330" y1="472" x2="330" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="500" y1="536" x2="620" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="532" y="530" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="539" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ISOLASI</text>

        <line x1="330" y1="572" x2="330" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="336" y="586" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="366" y="595" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABAIKAN</text>

        <!-- Nodes (painted last) -->
        <rect x="160" y="40" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="40" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Berkas baru / akses URL</text>
        <text x="330" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">endpoint (FIM / log akses)</text>

        <rect x="160" y="122" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="122" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Deteksi + hash</text>
        <text x="330" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Wazuh FIM · SHA-256</text>

        <rect x="160" y="204" width="340" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="204" width="340" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Pengayaan &amp; analisis</text>
        <text x="330" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VT · MB · OTX · ringkasan LLM</text>

        <rect x="160" y="286" width="340" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="286" width="340" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="330" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Keyakinan tinggi?</text>
        <text x="330" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verdict threat intel</text>

        <rect x="620" y="286" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="286" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="740" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Auto-karantina</text>
        <text x="740" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notifikasi "OTOMATIS DIISOLASI"</text>

        <rect x="160" y="400" width="340" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="400" width="340" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="330" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Tanya analis (HITL)</text>
        <text x="330" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telegram + tombol Isolasi/Abaikan</text>

        <rect x="160" y="500" width="340" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="500" width="340" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="330" y="530" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 · Analis menekan Isolasi?</text>
        <text x="330" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keputusan manusia</text>

        <rect x="620" y="500" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="500" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740" y="530" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8 · Karantina (AR)</text>
        <text x="740" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">via Wazuh API</text>

        <rect x="160" y="612" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="612" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="330" y="638" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">9 · Tandai FALSE POSITIVE</text>
        <text x="330" y="656" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tidak ada aksi</text>
      </svg>
    </div>
  </div>
</body>
</html>
