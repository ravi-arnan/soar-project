<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsitektur Berlapis</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Arsitektur SOAR Berlapis</h1>

        <title id="f33-title">Arsitektur SOAR berlapis menurut kelompok komponen</title>
        <desc id="f33-desc">Empat kelompok komponen: endpoint terdistribusi berisi agen ringan; server SOAR terpusat berisi Wazuh Manager, n8n, dan fleet-monitor; layanan eksternal berisi threat intelligence dan API LLM; serta human-in-the-loop berisi bot Telegram dan analis. Agen mengirim log ke Wazuh Manager yang meneruskan alert ke n8n, n8n berkonsultasi ke intel dan LLM, lalu berinteraksi dengan analis lewat Telegram dan memerintahkan Active Response ke Wazuh.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="171" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VT · MB · OTX · MISP · GSB · URLScan</text>

        <text x="729" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM API</text>
        <text x="729" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ringkasan + rekomendasi</text>

        <rect x="335" y="492" width="230" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="335" y="492" width="230" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="518" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telegram Bot</text>
        <text x="450" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notifikasi + tombol</text>

        <rect x="614" y="492" width="230" height="64" rx="6" fill="#f5f5f5"/>
