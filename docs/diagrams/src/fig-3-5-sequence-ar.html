<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alur Respons Human-in-the-Loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Alur Respons Human-in-the-Loop (Isolasi Berkas)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="seq-ar-title seq-ar-desc">
        <title id="seq-ar-title">Alur respons human-in-the-loop saat analis mengisolasi berkas</title>
        <desc id="seq-ar-desc">Urutan pesan ketika analis menekan tombol di Telegram: callback masuk ke n8n, yang memerintahkan Wazuh API dan agen untuk mengarantina berkas, lalu menandai pesan Telegram sebagai terisolasi; cabang lain menandai false positive.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines (drawn before messages) -->
        <line x1="110" y1="88" x2="110" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="300" y1="88" x2="300" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="500" y1="88" x2="500" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="700" y1="88" x2="700" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="880" y1="88" x2="880" y2="500" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ALT frame -->
        <rect x="286" y="240" width="626" height="236" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="286" y="240" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="306" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="298" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[klik = Isolasi]</text>
        <line x1="294" y1="424" x2="904" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="298" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else: Abaikan]</text>

        <!-- Messages (arrows) -->
        <!-- 1 Analis -> Telegram -->
        <line x1="110" y1="136" x2="300" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="164" y="118" width="82" height="12" rx="2" fill="#f5f5f5"/>
        <text x="205" y="127" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KEPUTUSAN</text>
        <!-- 2 Telegram -> n8n -->
        <line x1="300" y1="172" x2="500" y2="172" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="352" y="154" width="66" height="12" rx="2" fill="#f5f5f5"/>
        <text x="385" y="163" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLBACK</text>
        <!-- 3 n8n -> Telegram -->
        <line x1="500" y1="208" x2="300" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="360" y="190" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="199" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>
        <!-- 4 n8n -> Wazuh API -->
        <line x1="500" y1="300" x2="700" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="568" y="282" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="598" y="291" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUT AR</text>
        <!-- 5 Wazuh API -> Agent -->
        <line x1="700" y1="332" x2="880" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="758" y="314" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="788" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text>
        <!-- 6 Agent -> n8n (return, dashed) -->
        <line x1="880" y1="364" x2="500" y2="364" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="650" y="346" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="690" y="355" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUARANTINE</text>
        <!-- 7 n8n -> Telegram (headline success, accent) -->
        <line x1="500" y1="396" x2="300" y2="396" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="360" y="378" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="395" y="387" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIISOLASI</text>
        <!-- 8 n8n -> Telegram (else) -->
        <line x1="500" y1="468" x2="300" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="360" y="450" width="74" height="12" rx="2" fill="#f5f5f5"/>
        <text x="397" y="459" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FALSE POS.</text>

        <!-- Actor boxes (drawn last) -->
        <!-- Analis (input) -->
        <rect x="35" y="44" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="44" width="150" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="110" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analis</text>
        <!-- Telegram (backend) -->
        <rect x="225" y="44" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="225" y="44" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telegram Bot</text>
        <!-- n8n (focal) -->
        <rect x="425" y="44" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="425" y="44" width="150" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="500" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">n8n (callback)</text>
        <!-- Wazuh API (backend) -->
        <rect x="625" y="44" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="625" y="44" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wazuh API</text>
        <!-- Agent (backend) -->
        <rect x="805" y="44" width="150" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="805" y="44" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="880" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wazuh Agent</text>
      </svg>
    </div>
  </div>
</body>
</html>
