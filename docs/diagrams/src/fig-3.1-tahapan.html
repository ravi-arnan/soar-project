<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahapan Pengembangan</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Diagram Design</p>
    <h1>Tahapan Pengembangan Sistem</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 740" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="tl-title tl-desc">
        <title id="tl-title">Tahapan pengembangan sistem SOAR dengan umpan balik pengujian</title>
        <desc id="tl-desc">Enam tahap berurutan dari studi literatur hingga integrasi threat intel, LLM, dan human-in-the-loop. Setelah pengujian, bila sistem belum bekerja baik proses kembali ke tahap desain arsitektur; bila baik dilanjutkan ke dokumentasi.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <line x1="300" y1="104" x2="300" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="192" x2="300" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="280" x2="300" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="368" x2="300" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="456" x2="300" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="544" x2="300" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="470" y1="612" x2="620" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="520" y="606" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="535" y="615" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YA</text>

        <path d="M300,648 V688 Q300,696 292,696 H120 Q112,696 112,688 V168 Q112,160 120,160 H130" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="176" y="690" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="699" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIDAK</text>

        <!-- Nodes (painted last) -->
        <rect x="130" y="40" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="40" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Studi Literatur &amp; Kebutuhan</text>
        <text x="300" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">telaah SOAR · rumusan kebutuhan</text>

        <rect x="130" y="128" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="128" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Desain Arsitektur</text>
        <text x="300" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">komponen · alur playbook</text>

        <rect x="130" y="216" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="216" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Instalasi &amp; Konfigurasi</text>
        <text x="300" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Wazuh · n8n · agen · FIM</text>

        <rect x="130" y="304" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="304" width="340" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="300" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Playbook Orkestrasi n8n</text>
        <text x="300" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deteksi · klasifikasi · respons</text>

        <rect x="130" y="392" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="392" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="418" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Integrasi Intel, LLM &amp; HITL</text>
        <text x="300" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VT/MB/OTX · LLM · Telegram</text>

        <rect x="130" y="480" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="480" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Pengujian Sistem</text>
        <text x="300" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E2E · metrik · uji beban</text>

        <rect x="130" y="576" width="340" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="576" width="340" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="300" y="606" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sistem bekerja dengan baik?</text>
        <text x="300" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hasil pengujian lulus</text>

        <rect x="620" y="580" width="230" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="580" width="230" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="735" y="606" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 · Dokumentasi</text>
        <text x="735" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">laporan · panduan · luaran</text>
      </svg>
    </div>
  </div>
</body>
</html>
