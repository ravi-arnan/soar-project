<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Callback Telegram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:860px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:760px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Workflow Callback Telegram</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="cb-title cb-desc">
        <title id="cb-title">Workflow penanganan callback tombol Telegram</title>
        <desc id="cb-desc">Callback dari klik tombol Telegram masuk lewat webhook, keputusannya diurai, lalu tombol Telegram dihentikan animasinya. Bila aksinya Isolasi atau Blokir, sistem mengambil token Wazuh dan menjalankan Active Response, lalu mengubah pesan menjadi DIISOLASI/DIBLOKIR. Bila aksinya Abaikan, pesan ditandai false positive.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors + labels first -->
        <line x1="300" y1="104" x2="300" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="192" x2="300" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="280" x2="300" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="300" y1="376" x2="300" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="306" y="394" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="321" y="403" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YA</text>

        <path d="M470,340 H620 Q628,340 628,348 V560 Q628,568 620,568 H470" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="500" y="334" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="343" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIDAK</text>

        <line x1="300" y1="488" x2="300" y2="536" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="306" y="506" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="338" y="515" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UBAH PESAN</text>

        <!-- Nodes (painted last) -->
        <rect x="130" y="40" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="40" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Webhook /tg-callback</text>
        <text x="300" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terima klik tombol (dari poller)</text>

        <rect x="130" y="128" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="128" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Parse Keputusan</text>
        <text x="300" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aksi + agentId + berkas/URL sasaran</text>

        <rect x="130" y="216" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="216" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Answer Callback</text>
        <text x="300" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hentikan animasi loading tombol</text>

        <rect x="130" y="304" width="340" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="304" width="340" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="300" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Perlu tindakan?</text>
        <text x="300" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Isolasi / Blokir — bukan Abaikan</text>

        <rect x="130" y="424" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="424" width="340" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="300" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Jalankan Active Response</text>
        <text x="300" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Get token → !quarantine-file / !block-domain</text>

        <rect x="130" y="536" width="340" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="130" y="536" width="340" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="562" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Edit Pesan Telegram</text>
        <text x="300" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DIISOLASI / DIBLOKIR — atau FALSE POSITIVE</text>
      </svg>
    </div>
  </div>
</body>
</html>
