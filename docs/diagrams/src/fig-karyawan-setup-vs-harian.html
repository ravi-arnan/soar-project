<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup vs Harian</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif;
      --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1000px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Setup Sekali, Harian Otomatis, Pantauan Admin</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="ks-title ks-desc">
        <title id="ks-title">Tiga kelompok aktivitas: setup sekali, harian otomatis, dan pantauan admin</title>
        <desc id="ks-desc">Setup dilakukan sekali oleh admin (server dan pemasangan agen di 100 laptop). Setiap hari karyawan cukup mengunduh berkas seperti biasa; agen dan n8n menghitung hash, mengonsultasi intel dan LLM, lalu menilai apakah berkas berbahaya. Bila berbahaya, admin menerima alert dan mengisolasi berkas; bila bersih, alur berjalan senyap. Semua event mengalir ke pemantauan admin lewat dashboard atau terminal.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (fill only) -->
        <rect x="40" y="36" width="820" height="100" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="40" y="156" width="820" height="356" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="40" y="532" width="820" height="148" rx="6" fill="rgba(45,49,66,0.04)"/>
        <text x="56" y="50" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SEKALI SAJA · OLEH ADMIN IT</text>
        <text x="56" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HARIAN · OTOMATIS, TANPA INTERAKSI KARYAWAN</text>
        <text x="56" y="546" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PANTAUAN · ADMIN</text>

        <!-- Connectors + labels -->
        <path d="M450,120 V150 Q450,158 442,158 H218 Q210,158 210,166 V196" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="300" y="152" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETUP</text>

        <line x1="210" y1="260" x2="210" y2="286" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="210" y1="350" x2="210" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="350" y1="412" x2="470" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="372" y="406" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="410" y="415" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BERBAHAYA</text>

        <path d="M210,448 V470 Q210,478 218,478 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="366" y="482" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.02em">senyap — tanpa notifikasi</text>

        <path d="M625,448 V502 Q625,510 617,510 H318 Q310,510 310,518 V560" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <line x1="430" y1="592" x2="510" y2="592" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes (painted last) -->
        <rect x="250" y="52" width="400" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="250" y="52" width="400" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Setup sekali oleh Admin IT</text>
        <text x="450" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">setup-server.sh · .deb / Ansible (100 laptop)</text>

        <rect x="70" y="196" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="70" y="196" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Karyawan unduh berkas</text>
        <text x="210" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pakai laptop seperti biasa</text>

        <rect x="70" y="286" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="70" y="286" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Agen + n8n</text>
        <text x="210" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hash → intel + LLM → severity</text>

        <rect x="70" y="376" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="70" y="376" width="280" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="210" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Berbahaya?</text>
        <text x="210" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verdict threat intel</text>

        <rect x="470" y="376" width="310" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="470" y="376" width="310" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="625" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Alert + isolasi</text>
        <text x="625" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telegram → admin klik → berkas dikarantina</text>

        <rect x="190" y="560" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="190" y="560" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="310" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GUI / TUI</text>
        <text x="310" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboard :3000 · terminal</text>

        <rect x="510" y="560" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="510" y="560" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="630" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Status 100 laptop</text>
        <text x="630" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hijau = aman · donut severity</text>
      </svg>
    </div>
  </div>
</body>
</html>
